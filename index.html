<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>秋招工作台 · 单文件版</title>
<script>document.documentElement.dataset.theme=localStorage.getItem('qz-theme')||'auto'</script>
<style>
  /* 主题：日间白底 / 夜间炭黑底（#0f0f11 页底、#1a1a1d 卡面）。
     强调色全站统一为蓝，不再按页切换（2026-11-26 收拢）。 */
  /* ─── 配色令牌（2026-11-26 收拢版）──────────────────────────────
     单一强调色 + 中性灰阶 + 三个语义色，仅此而已。
     语义色只允许这三种用途，别处一律用中性色：
       --danger 今天截止 / 已过期 / 逾期 / 删除
       --warn   3 天内到期 / 笔试环节
       --acc    主操作 / 选中态 / 面试环节（在途）
     --u0/--u1/--u2 是日程倒计时的三档风险，分别指向上面三色。 */
  :root{--bd:#e2e2e6;--tx:#18181b;--mut:#71717a;--bg:#ffffff;--card:#ffffff;
        --acc:#2563eb;--onAcc:#ffffff;--accTx:#2563eb;--accSoft:rgba(37,99,235,.08);
        --hov:#f4f4f5;--act:#e8e8ec;
        --ok:#0e7a5f;--warn:#b45309;--danger:#c0392b;--bad:#c0392b;--red:#c0392b;
        --u0:#c0392b;--u1:#b45309;--u2:#71717a;
        --salbg:#e2f1ea;--saltx:#0b6e4f;--doneBg:#e8eefc;--doneTx:#2456c4}
  html[data-theme="dark"]{--bd:#2e2e33;--tx:#f2f2f2;--mut:#9a9aa2;--bg:#0f0f11;--card:#1a1a1d;
        --acc:#4d8bff;--onAcc:#ffffff;--accTx:#7aa7ff;--accSoft:rgba(77,139,255,.14);
        --hov:#232328;--act:#2f2f36;
        --ok:#4cc38a;--warn:#f0b354;--danger:#ff7a6e;--bad:#ff7a6e;--red:#ff7a6e;
        --u0:#ff7a6e;--u1:#f0b354;--u2:#9a9aa2;
        --salbg:#14342a;--saltx:#4cc38a;--doneBg:#1b2740;--doneTx:#7aa7ff}
  @media (prefers-color-scheme: dark){html[data-theme="auto"]{--bd:#2e2e33;--tx:#f2f2f2;--mut:#9a9aa2;--bg:#0f0f11;--card:#1a1a1d;
        --acc:#4d8bff;--onAcc:#ffffff;--accTx:#7aa7ff;--accSoft:rgba(77,139,255,.14);
        --hov:#232328;--act:#2f2f36;
        --ok:#4cc38a;--warn:#f0b354;--danger:#ff7a6e;--bad:#ff7a6e;--red:#ff7a6e;
        --u0:#ff7a6e;--u1:#f0b354;--u2:#9a9aa2;
        --salbg:#14342a;--saltx:#4cc38a;--doneBg:#1b2740;--doneTx:#7aa7ff}}
  *{box-sizing:border-box} body{margin:0;font:14px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--tx)}
  header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 16px;z-index:9}
  header .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  h1{font-size:17px;margin:0}
  .tabs button{font-size:15px;padding:6px 16px} .tabs button.on{background:var(--acc);color:var(--onAcc);border-color:var(--acc);font-weight:600}
  button{cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:4px 14px;font-size:13px;
         transition:background .12s,border-color .12s,color .12s,filter .12s,transform .05s}
  button:hover{border-color:var(--acc);color:var(--accTx);background:var(--hov)}
  button:active{background:var(--act);transform:translateY(1px)}
  button.primary{background:var(--acc);color:var(--onAcc);border-color:var(--acc);font-weight:600}
  button.primary:hover{background:var(--acc);color:var(--onAcc);filter:brightness(1.1)}
  button.primary:active{background:var(--acc);color:var(--onAcc);filter:brightness(.92);transform:translateY(1px)}
  button.btn-done{background:var(--doneBg);color:var(--doneTx);border-color:transparent;font-weight:600}
  button.btn-done:hover{background:var(--doneBg);color:var(--doneTx);filter:brightness(1.25)}
  button.btn-done:active{background:var(--doneBg);color:var(--doneTx);filter:brightness(.9);transform:translateY(1px)}
  button.btn-drop{color:var(--red)}
  button.btn-drop:hover{border-color:var(--red);color:var(--red);background:transparent}
  button.btn-drop:active{background:var(--act);transform:translateY(1px)}
  button:disabled{opacity:.45;cursor:default;transform:none;filter:none}
  main{max-width:1060px;margin:0 auto;padding:16px 16px 60px}
  /* 统计卡 */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:6px 0 12px}
  @media (max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}}
  .stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 14px;position:relative;overflow:hidden}
  .stat .num{font-size:26px;font-weight:700;line-height:1.15}
  .stat .num .u{font-size:15px;font-weight:400;color:var(--mut);margin-left:3px}
  .stat .num.red{color:var(--red)}
  .stat .lab{color:var(--mut);font-size:13px;margin-top:2px}
  .distline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--mut);font-size:13.5px;margin:2px 0 12px}
  .distline b{color:var(--tx)}
  .themebtn{border-radius:999px;padding:5px 14px}
  /* 搜索与页签 */
  .search{width:100%;padding:10px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:14px;margin:0 0 14px}
  .search::placeholder{color:var(--mut)}
  .btabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 6px}
  .btabs button{font-size:14.5px;padding:7px 18px;border-radius:999px}
  .btabs button.on{background:var(--acc);color:var(--onAcc);border-color:var(--acc);font-weight:600}
  .btabs button.on:hover{color:var(--onAcc);filter:brightness(1.08)}
  /* 分区标题 */
  h2{font-size:19px;margin:20px 0 12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  h2 .cnt{font-size:13.5px;color:var(--mut);font-weight:400}
  h3{font-size:14.5px;margin:16px 0 8px}
  h3 .cnt{font-size:12.5px;color:var(--mut);font-weight:400}
  /* 卡片 */
  .card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px 18px;margin:0 0 12px}
  .chead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .no{flex:none;width:26px;height:26px;border-radius:50%;background:var(--acc);color:var(--onAcc);font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center}
  .co{font-size:16.5px;font-weight:700} .unit{color:var(--mut);font-size:13px}
  .dlbadge{display:inline-block;background:var(--hov);color:var(--mut);border-radius:999px;padding:1px 10px;font-size:12.5px;margin:8px 0 2px}
  .descr{color:var(--mut);font-size:13.5px;white-space:pre-wrap;margin:8px 0}
  .intro{display:flex;gap:8px;align-items:flex-start;background:var(--hov);border-radius:10px;padding:9px 12px;color:var(--tx);font-size:13px;line-height:1.55;margin:10px 0 0}
  .intro .ic{flex:none;margin-top:2px;color:var(--accTx)}
  .notes{border-left:3px solid var(--bd);padding-left:12px;margin:12px 0 2px}
  .notes .descr{margin:2px 0}
  .nlab{display:flex;align-items:center;gap:4px;color:var(--mut);font-size:11.5px;font-weight:600;margin-bottom:2px}
  .job{border:1px solid var(--bd);border-radius:10px;margin-top:10px;padding:10px 12px;background:color-mix(in srgb,var(--hov) 45%,var(--card))}
  .job .t{font-weight:700;font-size:15px} .job .m{color:var(--mut);font-size:12.5px}
  .job .d{font-size:13.5px;white-space:pre-wrap;margin:5px 0;color:var(--tx)}
  .ops{margin:8px 0 4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .badge{font-size:12px;border-radius:999px;padding:2px 10px;background:var(--warn);color:#fff}
  .badge.done{background:var(--ok)} .badge.pause{background:var(--mut)}
  .links{margin:8px 0 2px}
  .links a,.job a,.card a{color:var(--accTx)}
  .tagrow{margin-top:10px}
  .tag{display:inline-block;background:var(--accSoft);color:var(--accTx);border-radius:999px;padding:1px 10px;font-size:12.5px;margin:2px 6px 2px 0}
  .tag.hot{background:rgba(214,69,65,.14);color:var(--red);font-weight:600}
  .pill{font-size:13px;border:1px solid var(--warn);color:var(--warn);border-radius:999px;padding:2px 10px;font-weight:600}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
  td,th{border-bottom:1px solid var(--bd);padding:7px 9px;text-align:left;vertical-align:top;font-size:13px}
  .st-投递中{color:var(--accTx)} .st-笔试{color:var(--warn)} .st-面试{color:var(--ok)} .st-未通过{color:var(--mut)}
  .mut{color:var(--mut)} .small{font-size:12.5px}
  a{color:var(--accTx)}
  /* 日程页 */
  .sched-head{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin:4px 0 14px}
  .today{font-size:27px;font-weight:700;line-height:1.25}
  .today .bdate{color:var(--accTx)}
  .sched-head .sub{color:var(--mut);font-size:13.5px;margin-top:3px}
  /* 日程行：左栏日期/倒计时 + 公司·标题 + 状态行，收起 ~52px */
  .srow .rhead{grid-template-columns:54px minmax(0,1fr) auto 16px;column-gap:10px}
  .srow .rbody{padding-left:76px}   /* 12 头部内边距 + 54 日期栏 + 10 间距：与标题左缘严格对齐 */
  .srow.hot0{--cdc:var(--danger)}
  .srow.hot1{--cdc:var(--warn)}
  .srow.hot0 .rhead,.srow.hot1 .rhead{box-shadow:inset 3px 0 0 var(--cdc)}
  .lg-inline{font-size:12px;font-weight:400;color:var(--mut);white-space:nowrap}
  .sdate{display:flex;flex-direction:column;line-height:1.2;min-width:0}
  .sdate b{font-size:13px;font-weight:600;color:var(--tx);white-space:nowrap;font-variant-numeric:tabular-nums}
  .sdate span{font-size:10.5px;color:var(--mut);white-space:nowrap;margin-top:1px}
  .sdate b.u0{color:var(--danger)}
  .sdate b.u1{color:var(--warn)}
  .sline1{display:flex;gap:6px;align-items:baseline;min-width:0}
  .sline1 .rco{flex:0 1 auto}
  .stitle{font-size:14px;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .smeta2{display:flex;flex-wrap:wrap;align-items:center;gap:3px 8px;margin-top:3px;font-size:12.5px;color:var(--mut)}
  .smeta2 .smtxt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .smeta2 .tag{margin:0;padding:0 8px;font-size:11.5px;line-height:1.6}
  .smeta2 .wtag{margin-left:0;font-size:11.5px}
  .cdpill{font-size:12px;font-weight:600;white-space:nowrap;border:1px solid var(--bd);border-radius:999px;padding:0 8px;color:var(--mut);line-height:1.7}
  .cdpill.u0{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
  .cdpill.u1{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 18px;border-radius:20px;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:88vw;text-align:center}
  .toast.show{opacity:.94}
  /* 图标化：内联 SVG 图标与长文折叠 */
  .ic{width:15px;height:15px;vertical-align:-2.5px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .ic.lg{width:19px;height:19px;vertical-align:-3.5px}
  button .ic{margin-right:4px}
  button.ibtn{padding:4px 8px}
  button.ibtn .ic{margin-right:0}
  .tag .ic{width:12.5px;height:12.5px;vertical-align:-2px;margin-right:3px}
  .badge .ic{width:12.5px;height:12.5px;vertical-align:-2px;margin-right:3px}
  .dlbadge .ic{width:13px;height:13px;vertical-align:-2px;margin-right:3px}
  .stat .lab .ic{margin-right:4px}
  h2 .ic{margin-right:5px}
  .distline .ic{margin-right:3px}
  .clamp{max-height:3.3em;overflow:hidden}
  .clampwrap.open .clamp{max-height:none}
  .clampbtn{display:inline-flex;align-items:center;gap:1px;color:var(--accTx);background:none;border:none;padding:2px 8px;font-size:12.5px;margin-top:2px}
  .clampbtn .ic{margin-right:0;transition:transform .15s}
  .clampwrap.open .clampbtn .ic{transform:rotate(180deg)}
  /* 对齐修正：图标与文字一律 flex 居中，消除基线漂移；折叠改精确两行裁切 */
  button{display:inline-flex;align-items:center;justify-content:center}
  .tag,.badge,.dlbadge{display:inline-flex;align-items:center;gap:3px}
  .tag .ic,.badge .ic,.dlbadge .ic{margin-right:0}
  .stat .lab{display:flex;align-items:flex-start;gap:4px}
  .stat .lab .ic{margin-right:0;margin-top:2.5px}
  .iline{display:flex;align-items:center;gap:4px}
  .rush .rtime{display:flex;align-items:center;gap:5px}
  .job .m{display:inline-flex;align-items:center;gap:2px;vertical-align:middle}
.sal,.job .m.sal{color:var(--saltx);background:var(--salbg);font-weight:700;border-radius:6px;padding:1px 6px}
  .sal .ic{width:12px;height:12px;color:var(--saltx);opacity:.75}
  .salnote{font-style:normal;font-weight:400;font-size:11.5px;color:var(--mut);margin-left:5px}
  .dst{display:inline-flex;align-items:center;gap:3px}
  .dst .ic{margin-right:0}
  .clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;max-height:none}
  .clampwrap.open .clamp{display:block;-webkit-line-clamp:unset}
</style>
<!--
════════════════════════════════════════════════════════════════════
给 AI 助手的维护说明（人看不到这段，AI 读文件时请先读这里）

本文件是「秋招工作台 · 单文件版」：一个自包含的校招投递管理页面，
无服务器、无依赖，双击即可在浏览器打开。界面与操作逻辑都在文件后部
的 <script id="app-script"> 里，一般不需要改代码。


1. 文件内嵌数据：<script type="application/json" id="qz-seed"> 里的
JSON，是本文件的出厂/交付数据。
2. 浏览器本地数据：用户在页面上的操作保存在 localStorage
（键 qz-single-db-v1），打开时页面比较两边的 savedAt，用较新的一份。
因此维护数据的正确姿势：
- 用户在页面里操作过 → 先让用户点页面右上角「导出数据」拿到最新
JSON，你改那份 JSON，再让用户点「导入数据」导回；或——
- 你直接改本文件 #qz-seed 的 JSON，并把 savedAt 改成当前时间
（ISO 格式，如 2026-11-20T23:30:00），用户下次打开即生效。
两种方式不要混用同一批改动，避免互相覆盖。

分享方式（2026-11-25 定版）：只保留分享文本——点卡片或岗位的分享按钮即复制人类可读文本，无弹窗。
口令生成、口令导入、#s= 分享链接解析均已删除（链接已于 2026-11-22 放弃）。
页头「导入」只用于导入全量数据 JSON 备份。

顶层对象：
{ version:1, savedAt:"ISO时间",
cards:[], records:[], pauses:[], verify:[], excluded:[], schedule:[]}

cards 待投递卡（一家公司一张卡，可多岗位）：
{ id:整数且全局唯一, company:"公司名", unit:"单位/部门",
deadline:"YYYY-MM-DD" 或 null, rolling:true/false（招满即止）,
descr:"卡片综述", tags:["标签"],
jobs:[{ title:"岗位名（卡内唯一）", meta:"城市 · 学历 · 届别",
desc:"岗位说明/JD 要点", salary:"薪资原文（官方未公布留空）"}],
links:[{ before:"投递入口：", text:"链接文字", href:"https://…",
after:""}]}

records 已投记录：
{ id, company, job:"岗位名", location:"城市",
appliedOn:"YYYY-MM-DD", status:"投递中|笔试|面试|未通过",
jd:"JD 全文或要点", url:"投递链接", note:"备注"}

pauses 暂缓岗位：{ cardId, jobTitle}（与 cards 里的岗位对应）

verify 备选·待核实：{ id, who:"对象", why:"卡点/待核实原因"}
excluded 已排除：{ id, who:"公司或公司 · 岗位", why:"排除/关闭原因"}

schedule 日程事项：
{ id, company, title:"事项名",
type:"assess 线上测评 | exam-online 线上笔试 | exam-offline 线下笔试
| ai AI面试 | interview 真人面试 | talk 宣讲会
| deadline 网申截止 | todo 待办",
date:"YYYY-MM-DD" 或 null（null = 无日期待办）,
dateEnd:"YYYY-MM-DD" 或 null（窗口型事项的结束日）,
time:"09:00–11:00" 或 "", status:"状态说明", detail:"详情",
entry:"行动入口URL", entryText:"入口文字",
link:"出处URL", linkText:"出处文字",
cdVerb:"开考/开始等倒计时动词", done:false, dropped:false}

（你在数据里手动模拟时请保持一致）
- 岗位点「已投递」→ 新增一条 records（status=投递中，appliedOn=当天，
location 取 job.meta 第一个「·」前字段），并从卡里移除该岗位；
卡内岗位全部处置完 → 整卡删除，并往 excluded 追加一条关卡说明。
- 岗位点「放弃」→ 从卡里移除；卡未空时往 excluded 追加「公司 · 岗位」一条。
- 岗位点「暂缓」→ 往 pauses 加一条；「取消暂缓」删之。
- 日程点「已完成」→ done=true（页面不再显示）；点「放弃」→ 整条删除。
════════════════════════════════════════════════════════════════════

<style>
.frm label{display:block;font-size:12.5px;color:var(--mut);margin:8px 0 3px}
.frm input[type=text],.frm input[type=date],.frm input[type=url],.frm select,.frm textarea{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font-size:13.5px}
.frm textarea{min-height:56px;resize:vertical}
.frm .grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media (max-width:760px){.frm .grid{grid-template-columns:1fr}}
.frm .jobrow{border:1px dashed var(--bd);border-radius:10px;padding:10px 12px;margin:8px 0}
.frm .frow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;border-top:1px solid var(--bd);padding-top:10px;flex:none}
select.stsel{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:2px 8px;font-size:12.5px}
.mini{padding:2px 10px;font-size:12px}
  /* ─── 配色收拢（2026-11-26 重写，替代原「彩色化」9 色体系）────────
     原来 4 张统计卡 4 色顶条 + 8 个板块页签 8 色 + 8 个日程类型 8 色
     + 状态 4 色 + 头像编号 8 色 = 32 种色相同时在场，等于没有强调。
     现在：统计卡顶条与数字一律中性，页签统一强调色，
     颜色只保留在真正有语义的三处（截止/笔试/面试）。 */
  /* 统计卡不再有彩色顶条：四个数字靠字号和位置就够了，加色条只是多四块噪音 */
  .stat.zero .num{color:var(--mut)}
  .stat.zero .lab .ic{color:var(--mut)}
  .stat .num{color:var(--tx);font-variant-numeric:tabular-nums}
  .stat .lab .ic{color:var(--mut)}
  /* 板块页签 / 日程类型页签：只留强调色，不再按类型分色 */
  #btabs button.on,#btabs button.on:hover{background:var(--acc);border-color:var(--acc);color:var(--onAcc)}

/* ================= 数据层（CORE） =================
   数据保存在 localStorage；文件内嵌 #qz-seed 为交付数据。
   打开时比较 savedAt，取较新的一份（AI 改文件维护靠这条规则）。 */
const LSKEY='qz-single-db-v1';
const STATUSES=['投递中','笔试','面试','未通过'];
function seedData(){return JSON.parse(document.getElementById('qz-seed').textContent)}
function norm(d){d=d||{};d.cards=d.cards||[];d.records=d.records||[];d.pauses=d.pauses||[];d.verify=d.verify||[];d.excluded=d.excluded||[];d.schedule=d.schedule||[];d.leads=d.leads||[];d.interview=d.interview||[];d.test=d.test||[];d.rush=d.rush||[];d.leadGroups=d.leadGroups||[];d.leadLinks=d.leadLinks||{};d.leadExtraTags=d.leadExtraTags||{};d.pipelineDef=d.pipelineDef||[];return d}
function savedAtCmp(a,b){const ta=Date.parse(a||''),tb=Date.parse(b||'');if(!isNaN(ta)&&!isNaN(tb))return ta<tb?-1:ta>tb?1:0;const x=String(a||''),y=String(b||'');return x<y?-1:x>y?1:0}
function loadDB(){
  const seed=seedData();
  let local=null;
  try{local=JSON.parse(localStorage.getItem(LSKEY)||'null')}catch(e){}
  if(local&&local.cards&&(!seed.savedAt||!local.savedAt||savedAtCmp(local.savedAt,seed.savedAt)>=0))return norm(local);
  return norm(seed);
}
let DB=loadDB();

function __strip(s){try{const o=JSON.parse(s);o.savedAt='';return JSON.stringify(o)}catch(e){return s}}
function __paintUndo(){const u=document.getElementById('undobtn'),r=document.getElementById('redobtn');if(u){u.disabled=!__undoStack.length;u.style.opacity=__undoStack.length?'1':'.45'}if(r){r.disabled=!__redoStack.length;r.style.opacity=__redoStack.length?'1':'.45'}}
function __restore(snap){__restoring=true;DB=norm(JSON.parse(snap));try{closeForm()}catch(e){}try{closeSForm()}catch(e){}save();__restoring=false;renderAll();__paintUndo()}
function undoLast(){if(!__undoStack.length)return;const cur=__curJSON;const snap=__undoStack.pop();if(cur)__redoStack.push(cur);__restore(snap);toast('已撤回上一步操作')}
function redoLast(){if(!__redoStack.length)return;const cur=__curJSON;const snap=__redoStack.pop();if(cur)__undoStack.push(cur);__restore(snap);toast('已恢复刚才撤回的操作')}

function save(){DB.savedAt=new Date().toISOString();const s=JSON.stringify(DB);if(!__restoring&&__curJSON&&__strip(s)!==__strip(__curJSON)){__undoStack.push(__curJSON);if(__undoStack.length>30)__undoStack.shift();__redoStack.length=0}try{localStorage.setItem(LSKEY,s);__curJSON=s}catch(e){toast('本地保存失败，请及时导出数据备份')}__paintUndo();noteChange()}
/* 备份提醒：改动过且距上次导出超过 7 天（或从未导出）时，顶部横幅提醒导出 */
const METAKEY='qz-single-meta-v1';
function loadMeta(){try{return JSON.parse(localStorage.getItem(METAKEY)||'{}')}catch(e){return{}}}
function saveMeta(m){try{localStorage.setItem(METAKEY,JSON.stringify(m))}catch(e){}}
function noteChange(){const m=loadMeta();if(!m.firstChangeAt){m.firstChangeAt=Date.now();saveMeta(m)}checkBackup()}
function checkBackup(){
  const bar=document.getElementById('backupbar');if(!bar)return;
  const m=loadMeta();const now=Date.now();const WEEK=7*24*3600*1000;
  let show=false;
  if(m.firstChangeAt){
    const changedSinceExport=!m.lastExportAt||(DB.savedAt&&new Date(DB.savedAt).getTime()>m.lastExportAt);
    const base=m.lastExportAt||m.firstChangeAt;
    if(changedSinceExport&&now-base>=WEEK)show=true;
    if(m.snoozeUntil&&now<m.snoozeUntil)show=false;
  }
  bar.style.display=show?'flex':'none';
  if(show){document.getElementById('backupbar-text').textContent=m.lastExportAt?'你的数据有改动，且距上次导出备份已超过 7 天。数据只存在本浏览器里，清掉就没了，建议现在导出一份。':'你的数据从未导出备份过。数据只存在本浏览器里，清掉就没了，建议现在导出一份。'}
}
function snoozeBackup(){const m=loadMeta();m.snoozeUntil=Date.now()+3*24*3600*1000;saveMeta(m);checkBackup()}
function nextId(arr){return arr.reduce((m,x)=>Math.max(m,x.id||0),0)+1}
function todayStr(){const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')}
function isPaused(cardId,title){return DB.pauses.some(p=>p.cardId===cardId&&p.jobTitle===title)}
function openCounts(){let oc=0,oj=0;for(const c of DB.cards){let n=0;for(const j of c.jobs)if(!isPaused(c.id,j.title))n++;if(n){oc++;oj+=n}}return{openCards:oc,openJobs:oj}}
function sortedRecords(){const rs=[...DB.records];rs.sort((a,b)=>((b.appliedOn||'')<(a.appliedOn||'')?-1:(b.appliedOn||'')>(a.appliedOn||'')?1:b.id-a.id));const d=rs.filter(r=>r.appliedOn),u=rs.filter(r=>!r.appliedOn);return d.concat(u)}
/* 薪资原文 → 一列扫得动的数字核心（2026-11-26）
   原文普遍带来源注释：「参考：8千-1.5万（51job 同名校招岗，上海）」，
   直接塞进收起行会把整行挤爆。规则：去「参考：」→ 砍掉第一个括号起的出处
   （全角半角混用、常有未闭合，从第一个左括号一律砍到底）→ 多档位只留第一档
   → 仍超过 14 字就抽数字区间。只用于收起态那一列，全文放 title，展开里仍是原文。 */
function salTxt(s){
  let t=String(s||'').replace(/\s+/g,' ').replace(/(\d),(?=\d{3})/g,'').trim();
  if(!t)return'';
  t=t.replace(/^参考[：:]\s*/,'');
  const br=t.search(/[（(]/);if(br>0)t=t.slice(0,br);
  t=t.split(/[；;]/)[0].replace(/[，,。、]\s*$/,'').trim();
  if(t.length<=14)return t;
  /* 数字前面也可能带单位（1.5w-2.5w），不然会从后半段「12-15」开始匹配 */
  const m=t.match(/\d[\d.]*\s*(?:k|K|千|万|w|W)?\s*[-~—–至到]\s*\d[\d.]*\s*(?:k|K|千|万|w|W|元)?(?:\s*\/\s*(?:月|年))?(?:\s*[·*×xX]\s*\d{1,2}\s*薪)?/);
  if(m)return m[0].replace(/\s+/g,'');
  /* 没有区间的长句（「转正后首年全部收入：本科17.6万起、硕士18.6万起」），
     挑第一个带数字+单位的小句，再砍掉前面的标签词，比硬截断好读 */
  for(const seg of t.split(/[，,、；;]/)){
    const s=seg.trim();
    if(!/\d/.test(s)||!/(万|千|[kK]|元|薪)/.test(s))continue;
    const bare=s.includes('：')?s.slice(s.lastIndexOf('：')+1).trim():s;
    if(bare.length<=14)return bare;
  }
  const d=t.search(/\d/);if(d>0&&d<=10)t=t.slice(d);
  return t.length>14?t.slice(0,14)+'…':t;
}
/* 一组岗位的薪资 → 收起行那一格里的一句话（2026-11-26）
   按精简后的口径去重（原文只差来源注释的算同一档），最多并列两条，
   再多只写「首条 等 N 档」，全文挂 title。一个都没填就留空，不写占位词。 */
function salLine(list){
  const uniq=[],raw=[];
  for(const x of list){
    const t=salTxt(x);
    if(!t)continue;
    if(!raw.includes(String(x).trim()))raw.push(String(x).trim());
    if(!uniq.includes(t))uniq.push(t);
  }
  if(!uniq.length)return{txt:'',tip:'这些岗位都还没填薪资'};
  /* 一格的宽度约 20 个西文字符，两档并列塞不下就退回「首条 等 N 档」，
     免得出现「9-13k·13薪 / 12-20k…」这种被切掉一半的并列 */
  const est=str=>[...str].reduce((n,ch)=>n+(ch.charCodeAt(0)>255?12.2:6.9),0);
  let head=uniq[0];
  if(est(head)>130){
    const r=head.match(/\d[\d.]*\s*(?:k|K|千|万|w|W)?\s*[-~—–至到]\s*\d[\d.]*\s*(?:k|K|千|万|w|W|元)?(?:\s*\/\s*(?:月|年))?(?:\s*[·*×xX]\s*\d{1,2}\s*薪)?/);
    if(r)head=r[0].replace(/\s+/g,'');
  }
  const two=uniq.slice(0,2).join(' / ');
  const txt=uniq.length===2&&est(two)<=146?two:(uniq.length===1?head:head+' 等'+uniq.length+'档');
  /* 「面议」这类没有数字的口径不上主色，跟缺失一样按次要信息处理 */
  return{txt,neutral:!/\d/.test(txt),tip:raw.length>1?'共 '+uniq.length+' 档薪资：\n'+raw.slice(0,6).join('\n'):'薪资：'+raw[0]};
}
/* 展开区的薪资标签（2026-11-26 二次）：数值走主色，括号里的出处降成灰字。
   原来整串「参考：12-24k·14薪（猎聘·同类）」都同色，比岗位名还长、还抢眼；
   拆开后一眼是金额，出处留给想核对的人，全文仍在 title 里。 */
function salChip(s){
  const raw=String(s||'').trim();if(!raw)return'';
  const i=raw.search(/[（(]/);
  let note=i>0?raw.slice(i).replace(/^[（(]/,'').replace(/[）)]+$/,'').trim():'';
  if(note.length>24)note=note.slice(0,24)+'…';
  const ref=/^参考[：:]/.test(raw)?'参考 · ':'';
  const v=salTxt(raw)||raw;
  const extra=(ref+note).trim();
  return `<span class="sal" title="${esc(raw)}">${ic('cash')}${esc(v)}${extra?`<i class="salnote">${esc(extra)}</i>`:''}</span>`;
}

function markJob(cardId,idx,action){
  const c=DB.cards.find(x=>x.id===cardId);if(!c)return;
  const j=c.jobs[idx];if(!j)return;
  const today=todayStr();
  if(action==='paused'){
    if(!isPaused(cardId,j.title))DB.pauses.push({cardId,jobTitle:j.title});
    save();renderAll();toast('已暂缓');return;
  }
  c.jobs=c.jobs.filter((_,i)=>i!==idx);
  DB.pauses=DB.pauses.filter(p=>!(p.cardId===cardId&&p.jobTitle===j.title));
  if(action==='applied'){
    const loc=(j.meta&&j.meta.includes('·'))?j.meta.split('·')[0].trim():'';
    const url=((c.links||[]).find(l=>l.href)||{}).href||'';
    DB.records.push({id:nextId(DB.records),company:c.company,job:j.title,location:loc,appliedOn:today,status:'投递中',jd:j.desc||'',url,salary:j.salary||'',note:'看板标记已投递（'+today+'）'});
  }
  if(c.jobs.length===0){
    DB.cards=DB.cards.filter(x=>x.id!==cardId);
    DB.pauses=DB.pauses.filter(p=>p.cardId!==cardId);
    const why=(action==='applied'?`岗位「${j.title}」已投递（见已投记录）。`:`岗位「${j.title}」已放弃（看板标记）。`)+`该卡全部岗位已处置，整卡关闭（${today}）。`;
    DB.excluded.push({id:nextId(DB.excluded),who:c.company,why});
  }else if(action==='dropped'){
    DB.excluded.push({id:nextId(DB.excluded),who:c.company+' · '+j.title,why:`在看板标记放弃（${today}）。`});
  }
  save();renderAll();toast(action==='applied'?'已投递 · 已落账生效':'已放弃 · 已落账生效');
}
function unpauseJob(cardId,title){DB.pauses=DB.pauses.filter(p=>!(p.cardId===cardId&&p.jobTitle===title));save();renderAll();toast('已取消暂缓')}
function unpauseIdx(cardId,idx){const c=DB.cards.find(x=>x.id===cardId);if(!c||!c.jobs[idx])return;unpauseJob(cardId,c.jobs[idx].title)}

function delVerify(id){DB.verify=DB.verify.filter(x=>x.id!==id);save();renderAll()}

let BTAB='apply',Q='';
const BTABS=[['apply','待投递'],['records','全部已投'],['leads','待投线索'],['interview','面试中'],['test','笔试中'],['rush','冲刺项'],['verify','备选'],['excluded','已排除 · 待核实']];
const TABIC={apply:'brief',leads:'cap',interview:'users',test:'pen',rush:'target',verify:'eye',records:'list',excluded:'ban'};
function setBTab(t){BTAB=t;document.querySelectorAll('#btabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));BTABS.forEach(([k])=>{const el=$('#panel-'+k);if(el)el.style.display=k===t?'':'none'});applySearch()}
function applySearch(){
  const q=Q.trim().toLowerCase(),panel=$('#panel-'+BTAB);if(!panel)return;
  let vis=0;
  const underHidden=el=>{let p=el.parentElement;while(p&&p!==panel){if(p.hidden||getComputedStyle(p).display==='none')return true;p=p.parentElement}return false};
  panel.querySelectorAll('.flt').forEach(el=>{
    const on=!q||(el.dataset.q||'').includes(q);
    el.style.display=on?'':'none';
    if(on&&!underHidden(el))vis++;
  });
  /* 记录页按公司合并：有搜索词时自动展开命中的公司，清空后恢复用户自己的开合状态 */
  panel.querySelectorAll('.rgrow').forEach(g=>{
    const body=g.querySelector('.rbody');if(!body)return;
    const hit=[...g.querySelectorAll('.rjob')].filter(j=>j.style.display!=='none');
    const open=q?hit.length>0:OPENROWS.has('co:'+g.dataset.co);
    g.classList.toggle('open',open);body.hidden=!open;
    /* 过滤时头部改报「匹配 N 条」，否则右边还挂着全量的「8 岗 / 投递中 8」，和眼前一条对不上 */
    const line=g.querySelector('.rjobline');
    if(line){if(!line.dataset.orig)line.dataset.orig=line.innerHTML;
      if(q&&hit.length)line.innerHTML=`<b>匹配 ${hit.length} 条</b>`;else line.innerHTML=line.dataset.orig}
  });
  panel.classList.toggle('filtering',!!q);
  panel.querySelectorAll('.rlist').forEach(l=>{
    const any=[...l.children].some(c=>c.style.display!=='none'&&!c.hidden);
    l.style.display=(q&&!any)?'none':'';
  });
  let nr=panel.querySelector('.nores');if(!nr){nr=document.createElement('p');nr.className='nores mut';nr.textContent='没有匹配的条目';panel.appendChild(nr)}
  nr.style.display=(q&&vis===0)?'':'none';
}

  $('#st-openlab').innerHTML=ic('brief')+`待投递（家）· ${cnt.openJobs} 岗`;

  $('#st-lead').textContent=DB.leads.length;
  /* 有值的卡给一条细蓝线，0 值保持灰——不用四种颜色区分，也能一眼看出哪块是空的 */
  [['#st-open',cnt.openCards],['#st-rec',DB.records.length],['#st-exam',(sc['笔试']||0)+(sc['面试']||0)],['#st-lead',DB.leads.length]]
    .forEach(([sel,v])=>{const st=$(sel);if(!st)return;const card=st.closest('.stat');if(!card)return;
      card.classList.toggle('has',v>0);card.classList.toggle('zero',!(v>0))});
  const SIC={'投递中':'send','笔试':'pen','面试':'users','未通过':'xcirc'};
  const parts=STATUSES.filter(k=>sc[k]).map(k=>`<span class="dst stc-${k}">${ic(SIC[k]||'dot')}${k} <b>${sc[k]}</b></span>`);
  Object.keys(sc).filter(k=>!STATUSES.includes(k)).forEach(k=>parts.push(`<span class="dst">${ic('dot')}${esc(k)} <b>${sc[k]}</b></span>`));
  parts.push(`<span class="dst stc-暂缓">${ic('pause')}暂缓 <b>${DB.pauses.length}</b></span>`);

/* ─── 行 + 展开（2026-11-26）────────────────────────────────────
   收起：一行一家公司（约 52px），公司名 + 首个岗位 + 截止/岗位数 + 箭头。
   展开：原卡片的全部内容（链接、简介、说明、岗位操作、标签、编辑删除）。
   开合状态存 OPENROWS，重渲染（如标记已投）后保留，不会突然全部收起。 */
const OPENROWS=new Set();
/* 键统一转成字符串：卡行用数字 id、冲刺行用 'r3'、公司组合行用 'co:公司名'，
   混用数字与字符串会让「展开后重渲染」判断失配，状态就丢了。 */
function rowKeyOf(row){return String(row.dataset.id||'')}
function setRowOpen(row,open){
  const key=rowKeyOf(row),body=row.querySelector('.rbody'),head=row.querySelector('.rhead');
  if(!body||!key)return;row.classList.toggle('open',open);body.hidden=!open;
  if(head)head.setAttribute('aria-expanded',open?'true':'false');
  if(open)OPENROWS.add(key);else OPENROWS.delete(key);
}
function toggleRow(head){const row=head.closest('.rrow');if(row)setRowOpen(row,!row.classList.contains('open'))}
function rowKey(e,head){if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleRow(head)}}
function isRowOpen(row){const k=rowKeyOf(row);return k?OPENROWS.has(k):false}
function expandAll(open,scope){document.querySelectorAll((scope||'#panel-apply')+' .rrow').forEach(r=>setRowOpen(r,open))}
function cardHtml(c,no){
  const jobsHtml=c.jobs.map((j,idx)=>{
    let ops='';
    if(isPaused(c.id,j.title))ops=`<div class="ops"><span class="badge pause">${ic('pause')}暂缓中</span>
      <button onclick="unpauseIdx(${c.id},${idx})">${ic('play')}取消暂缓</button>
 <button title="分享这个岗位" onclick="openShare(${c.id},${idx})">${ic('share')}分享</button></div>`;
    else ops=`<div class="ops">
      <button class="primary" onclick="markJob(${c.id},${idx},'applied')">${ic('check')}已投</button>
      <button onclick="markJob(${c.id},${idx},'dropped')">${ic('x')}放弃</button>
      <button onclick="markJob(${c.id},${idx},'paused')">${ic('pause')}暂缓</button>
 <button title="分享这个岗位" onclick="openShare(${c.id},${idx})">${ic('share')}分享</button></div>`;
    return `<div class="job"><span class="t">${esc(j.title)}</span> <span class="m">${j.meta?ic('pin')+esc(j.meta):''}</span>${j.salary?` ${salChip(j.salary)}`:''}
      ${j.link?`<div class="small iline">${ic('link')}<a href="${esc(j.link.href)}" target="_blank" rel="noopener">${esc(j.link.text||j.link.href)}</a></div>`:''}
      ${j.desc?clampHtml(j.desc,'d'):''}${ops}</div>`}).join('');
  const dlU=(c.deadline&&daysUntil(c.deadline)>=0&&daysUntil(c.deadline)<=3)?' urg':'';
  const q=(c.company+' '+(c.unit||'')+' '+(c.descr||'')+' '+(c.intro||'')+' '+c.jobs.map(j=>j.title+' '+(j.meta||'')+' '+(j.salary||'')).join(' ')+' '+(c.tags||[]).join(' ')).toLowerCase();
  /* 收起态右侧只放会改变判断的信息：截止 / 岗位数 / 暂缓数。没有就留空。 */
  const pausedN=c.jobs.filter(j=>isPaused(c.id,j.title)).length;
  const liveFirst=c.jobs.find(j=>!isPaused(c.id,j.title))||c.jobs[0]||{};
  const restN=c.jobs.length-1;
  const meta=[
    (c.deadline||c.rolling)?`<span class="dltag${dlU}">${ic('clock')}<span class="dlmain">${esc(dlMain(c))}</span><span class="dlsub">${esc(dlSub(c))}</span></span>`:'',
    c.jobs.length>1?`<span class="jt">${c.jobs.length} 岗</span>`:'',
    pausedN?`<span class="pz">暂缓 ${pausedN}</span>`:''
  ].filter(Boolean).join('');
  const open=OPENROWS.has(String(c.id));
  /* 首行那个岗位的薪资排在最前，其余岗位的薪资并列跟上（去重，最多两条） */
  const sl=salLine([liveFirst.salary,...c.jobs.filter(j=>j!==liveFirst).map(j=>j.salary)]);
  return `<div class="rrow crow flt${open?' open':''}" data-id="${c.id}" data-q="${esc(q)}">
    <div class="rhead" role="button" tabindex="0" aria-expanded="${open?'true':'false'}" onclick="toggleRow(this)" onkeydown="rowKey(event,this)">
      <span class="rno">${String(no).padStart(2,'0')}</span>
      <div style="min-width:0"><div style="display:flex;gap:7px;align-items:baseline;min-width:0"><span class="rco">${esc(c.company)}</span><span class="runit">${esc(c.unit||'')}</span></div>
        <div class="rjobline"><b>${esc(liveFirst.title||'')}</b>${restN>0?` · 另 ${restN} 岗`:''}</div></div>
      <span class="rsal${sl.txt?(sl.neutral?' mut':''):' none'}" title="${esc(sl.tip)}">${esc(sl.txt)}</span>
      <div class="rmeta">${meta}</div>
      <span class="rchev">${ic('chev')}</span>
    </div>
    <div class="rbody"${open?'':' hidden'}>
    ${(c.links&&c.links.length)?`<div class="links">${c.links.map(linkLine).join('')}</div>`:''}
    ${c.intro?`<div class="intro">${ic('brief')}<div>${esc(c.intro)}</div></div>`:''}
    ${c.descr?`<div class="notes"><div class="nlab">${ic('clip')}招聘说明</div>${clampHtml(c.descr,'descr')}</div>`:''}
    ${jobsHtml}
    ${(c.tags&&c.tags.length)?`<div class="tagrow">${c.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:''}
    <div class="rfoot"><button class="mini" onclick="openShare(${c.id})">${ic('share')}分享卡片</button><button class="mini" onclick="openCardForm(${c.id})">${ic('pencil')}编辑</button><button class="mini btn-drop" onclick="deleteCard(${c.id})">${ic('trash')}删除</button></div>
    </div></div>`;
}
function renderBoard(){
  renderHead();
  /* 计数口径统一（2026-11-26 修）：chip 的数字必须等于点进去后该区块标题的数量。
     原先 interview/test 用 records.status 过滤（20/7），区块用 DB.test/DB.interview（22/9），
     两个数字对不上，用户会认为数据错了。此处一律取区块自身长度。 */
  const tcnt={apply:openCounts().openCards,leads:DB.leads.length,interview:(DB.interview||[]).length,test:(DB.test||[]).length,rush:DB.rush.length,verify:DB.verify.length,records:DB.records.length,excluded:DB.excluded.length};
  $('#btabs').innerHTML=BTABS.map(([k,label])=>`<button data-t="${k}" class="${k===BTAB?'on':''}" onclick="setBTab('${k}')">${ic(TABIC[k]||'dot')}${label} ${tcnt[k]??''}</button>`).join('');
  const cards=[...DB.cards].sort((a,b)=>{if(a.deadline&&b.deadline)return a.deadline<b.deadline?-1:1;if(a.deadline)return -1;if(b.deadline)return 1;return a.id-b.id});
  /* 两个列表各自独立编号：暂缓卡不占待投递的号，否则会出现 01、02、16、17 的跳号 */
  let openHtml='',pauseHtml='',nOpen=0,nPause=0;
  for(const c of cards){
    const openN=c.jobs.filter(j=>!isPaused(c.id,j.title)).length;
    if(openN===0&&c.jobs.length===0)continue;
    if(openN>0)openHtml+=cardHtml(c,++nOpen);else if(c.jobs.length)pauseHtml+=cardHtml(c,++nPause);
  }
  const cnt=openCounts();
  const h2ops=`<span class="h2ops"><button onclick="expandAll(true)">${ic('chev')}全部展开</button><button onclick="expandAll(false)">全部收起</button></span>`;
  $('#panel-apply').innerHTML=`
    <h2>${ic('brief','lg')}待投递 <span class="cnt">${cnt.openCards} 家 · ${cnt.openJobs} 岗 · 暂缓 ${DB.pauses.length}</span>${h2ops}</h2>
    ${openHtml?`<div class="rlist">${openHtml}</div>`:'<p class="mut">无</p>'}
    ${pauseHtml?`<h2>${ic('pause','lg')}暂缓投递 <span class="cnt">${DB.pauses.length} 个</span></h2><div class="rlist">${pauseHtml}</div>`:''}`;
  const recs=sortedRecords();
  /* 同一公司的已投记录合并成一条（2026-11-26）：458 条 → 261 家，
     公司只出现一次，岗位收在展开区里，各自的日期/状态/备注/删除都还在。
     OPENROWS 记 'co:公司名'，标记已投触发的重渲染不会把展开状态吸回去。 */
  const byCo=new Map();
  for(const r of recs){const k=r.company||'（未填公司）';if(!byCo.has(k))byCo.set(k,[]);byCo.get(k).push(r)}
  const recGrps=[...byCo.entries()].map(([co,rs])=>{
    rs.sort((a,b)=>(b.appliedOn||'')<(a.appliedOn||'')?-1:(b.appliedOn||'')>(a.appliedOn||'')?1:b.id-a.id);
    const isIso=v=>/^\d{4}-\d{2}-\d{2}$/.test(v||'');
    const dates=rs.map(r=>r.appliedOn).filter(isIso).sort();
    const locs=[...new Set(rs.map(r=>(r.location||'').trim()).filter(Boolean))];
    const sc={};rs.forEach(r=>sc[r.status]=(sc[r.status]||0)+1);
    const allq=rs.map(r=>r.company+' '+r.job+' '+(r.location||'')+' '+(r.status||'')+' '+(r.note||'')+' '+(r.salary||'')).join(' ').toLowerCase();
    return {co,rs,latest:dates[dates.length-1]||'',earliest:dates[0]||'',locs,sc,allq,maxId:Math.max(...rs.map(r=>r.id||0))};
  });
  recGrps.sort((a,b)=> (b.latest||'').localeCompare(a.latest||'') || b.maxId-a.maxId);
  const recJobRow=r=>{
    const q=(r.company+' '+r.job+' '+(r.location||'')+' '+(r.status||'')+' '+(r.note||'')).toLowerCase();
    const noteRaw=(r.note||'').trim();
    /* 「看板标记已投递（2026-11-26）」这类自动写入的备注，日期列已经有了，别再重复一遍 */

    const sub=[esc(r.location||''),esc((autoNote?'':noteRaw).slice(0,160))].filter(Boolean).join(' · ');
    return `<div class="rjob flt" data-q="${esc(q)}">
      <span class="jdate" title="${/^\d{4}-\d{2}-\d{2}$/.test(r.appliedOn||'')?'投递日期 '+esc(r.appliedOn):'这条没有记录投递日期'}">${/^\d{4}-\d{2}-\d{2}$/.test(r.appliedOn||'')?esc(r.appliedOn):'—'}</span>
      <div class="jmain"><div class="jtitle">${r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.job)}</a>`:esc(r.job)}${r.salary?` ${salChip(r.salary)}`:''}</div>
        ${sub?`<div class="jsub" title="${esc((r.location||'')+(!autoNote&&r.note?' · '+r.note:''))}">${sub}</div>`:''}</div>

    <div style="margin:0 0 10px"><button onclick="openRecordForm()">${ic('plus')}新增记录</button></div>
    ${recGrps.length?`<div class="rlist">${recGrps.map(recGrpRow).join('')}</div>`:'<p class="mut">无</p>'}`;
  $('#panel-verify').innerHTML=`<h2>${ic('eye','lg')}备选 <span class="cnt">${DB.verify.length} 条</span></h2>
    <div class="frm" style="display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px">
      <input type="text" id="vf-who" placeholder="对象（如公司名）" style="flex:1;min-width:140px">

      <button class="primary" onclick="submitVerify()">${ic('plus')}加入</button></div>
    <table><colgroup><col style="width:200px"><col><col style="width:40px"></colgroup><tr><th>对象</th><th>卡点</th><th></th></tr>${DB.verify.map(v=>`<tr class="flt" data-q="${esc((v.who+' '+v.why).toLowerCase())}"><td>${esc(v.who)}</td><td class="small">${esc(v.why)}</td><td><button class="mini ibtn btn-drop" title="删除" onclick="delVerify(${v.id})">${ic('trash')}</button></td></tr>`).join('')}</table>`;
  $('#panel-excluded').innerHTML=`<h2>${ic('ban','lg')}已排除 <span class="cnt">${DB.excluded.length} 条</span></h2><table><colgroup><col style="width:210px"><col><col style="width:40px"></colgroup><tr><th>公司/岗位</th><th>原因</th><th></th></tr>${DB.excluded.map(e=>`<tr class="flt" data-q="${esc((e.who+' '+e.why).toLowerCase())}"><td>${esc(e.who)}</td><td class="small">${esc(e.why)}</td><td><button class="mini ibtn btn-drop" title="删除" onclick="delExcluded(${e.id})">${ic('trash')}</button></td></tr>`).join('')}</table>`;

  const groups=(DB.leadGroups&&DB.leadGroups.length)?DB.leadGroups:[{key:'A',title:'A 组'},{key:'B',title:'B 组'},{key:'C',title:'C 组'},{key:'D',title:'D 组'}];
  const leadLinkHtml=Object.entries(DB.leadLinks||{}).map(([co,l])=>`<div class="small">${esc(co)}：<a href="${esc(l.href)}" target="_blank">${esc(l.label||l.href)}</a></div>`).join('');
  let leadHtml=leadLinkHtml;const seenG=new Set();

  /* 阶段清单同样压成行：一行一条，首行公司+岗位，次行进度（单行省略，悬停看全文） */
  const stageRow=(v,i)=>{

    const txt=metas.map(m=>`${m.before||''}${m.text||''}${m.after||''}`).join(' ｜ ');

    return `<div class="rrow flt" data-q="${esc((v.company+' '+v.job+' '+q).toLowerCase())}">
      <div class="rhead" style="cursor:default" ${href?`onclick="window.open('${esc(href)}','_blank')"`:''}>

          ${txt?`<div class="stageMeta" title="${esc(txt)}">${esc(txt)}</div>`:''}</div>

        <span></span>

  $('#panel-interview').innerHTML=`<h2>${ic('users','lg')}面试中 <span class="cnt">${DB.interview.length} 条</span></h2>${DB.interview.length?`<div class="rlist">${DB.interview.map(stageRow).join('')}</div>`:'<p class="mut">无</p>'}`;
  $('#panel-test').innerHTML=`<h2>${ic('pen','lg')}笔试中 <span class="cnt">${DB.test.length} 条</span></h2>${DB.test.length?`<div class="rlist">${DB.test.map(stageRow).join('')}</div>`:'<p class="mut">无</p>'}`;
  const rushRow=(v,i)=>{
    const q=(v.title+' '+(v.unit||'')+' '+(v.descr||'')).toLowerCase();
    const rOpen=OPENROWS.has('r'+v.id);
    return `<div class="rrow flt${rOpen?' open':''}" data-id="r${v.id}" data-q="${esc(q)}">
      <div class="rhead" role="button" tabindex="0" onclick="toggleRow(this)" onkeydown="rowKey(event,this)">

  };

  $('#panel-rush').innerHTML=`<h2>${ic('target','lg')}冲刺项 <span class="cnt">${DB.rush.length} 项</span></h2>${rushHtml?`<div class="rlist">${rushHtml}</div>`:'<p class="mut">无</p>'}`;

/* ---------------- 日程表 ---------------- */
const TL={assess:'线上测评','exam-online':'线上笔试','exam-offline':'线下笔试',ai:'AI面试',interview:'真人面试',talk:'宣讲会',deadline:'网申截止',todo:'待办',done:'已完成'};
const FIVE=['assess','exam-online','exam-offline','ai','interview'];
const TYPEIC={assess:'clip','exam-online':'pen','exam-offline':'pen',ai:'spark',interview:'users',talk:'mega',deadline:'clock',todo:'inbox',done:'check'};
const PIC={'投递中':'send','笔试':'pen','面试':'users','未通过':'xcirc'};
function finished(it){return it.done||it.dropped||it.type==='done'||/^(已完成|已过期|已结束)/.test(it.status||'')}
function visible(it){return !finished(it)&&!(it.date&&it.date<todayStr())}
function daysUntil(ds){const t=new Date();t.setHours(0,0,0,0);const d=new Date(ds+'T00:00:00');return Math.round((d-t)/864e5)}
function cdText(it){
  const days=daysUntil(it.date),tm=it.time?' '+esc(it.time):'';
  if(days===0)return `0 天后 · 今天${tm}`;
  if(days===1)return `1 天后 · 明天${tm}`;
  const d=new Date(it.date+'T00:00:00');
  return `${days} 天后 · ${d.getMonth()+1} 月 ${d.getDate()} 日${tm}`;
}
const WD=['日','一','二','三','四','五','六'];
function fmtD(ds){if(!ds)return'';const d=new Date(ds+'T00:00:00');return `${d.getMonth()+1}月${d.getDate()}日（周${WD[d.getDay()]}）`}
function warnTags(it){
  const t=((it.status||'')+' '+(it.detail||'')).replace(/不撞车|无撞车|未撞车|没撞车|没有撞车|不冲突|无冲突/g,'');
  const out=[];
  if(t.includes('撞车'))out.push(`<span class="wtag">${ic('alert')}疑似撞车</span>`);
  if(t.includes('待核对')||t.includes('待确认'))out.push(`<span class="wtag amb">${ic('eye')}待核对</span>`);
  if(t.includes('逾期')||t.includes('视为放弃'))out.push(`<span class="wtag crit">${ic('clock')}逾期视为放弃</span>`);
  return out.join('');
}
/* 旧版整段截止文案；行视图已改用 dlMain/dlSub 拆分，此处保留供表单/分享复用 */
function dlText(c){
  if(!c.deadline)return c.rolling?'招满即止':'无截止';
  const d=daysUntil(c.deadline),md=esc(c.deadline.slice(5));
  if(d<0)return `已过期 · ${esc(c.deadline)}`;
  if(d===0)return `今天截止 · ${md}`;
  return `剩 ${d} 天 · ${md} 截止`;
}
/* 截止文案拆两段：主段（剩 N 天）永远显示，副段（· 12-06 截止）在窄屏收起 */
function dlMain(c){
  if(!c.deadline)return c.rolling?'招满即止':'';
  const d=daysUntil(c.deadline);
  if(d<0)return '已过期';
  if(d===0)return '今天截止';
  return `剩 ${d} 天`;
}
function dlSub(c){
  if(!c.deadline)return '';
  const md=(c.deadline||'').slice(5),d=daysUntil(c.deadline);
  if(d<0)return ' · '+c.deadline;
  if(d===0)return ' · '+md;
  return ' · '+md+' 截止';
}
function schedOps(it){return `<button class="btn-done" onclick="schedDone(${it.id})">${ic('check')}完成</button>
  <button class="btn-drop" onclick="schedDrop(${it.id})">${ic('x')}放弃</button>`}
function entryLine(it){return it.entry?`<div class="small iline">${ic('ext')}<a href="${esc(it.entry)}" target="_blank">${esc(it.entryText||it.entry)}</a></div>`:(it.entryText?`<div class="small iline">${ic('ext')}${esc(it.entryText)}</div>`:'')}
function srcLine(it){return it.link?`<div class="small mut iline">${ic('link')}<a href="${esc(it.link)}" target="_blank">${esc(it.linkText||it.link)}</a></div>`:''}
/* 日程行（2026-11-26）：原来「迫在眉睫」每张卡撑满整行宽、约 240px 高，
   一屏只放得下 3 条。改成与待投递同一套「行 + 展开」：收起 ~52px，
   左栏放日期（迫在眉睫区放倒计时），点开才看详情、入口链接与完成/放弃。 */
function srowHtml(it){
  const hasDate=!!it.date;
  const days=hasDate?daysUntil(it.date):null;
  const d=hasDate?new Date(it.date+'T00:00:00'):null;
  const over=days!==null&&days<0;
  const tier=days===null?'':(over||days<=1?'u0':days<=3?'u1':'u2');
  const TVERB={deadline:'截止','exam-online':'开考','exam-offline':'开考',interview:'面试',ai:'AI 面试',assess:'测评',talk:'宣讲'};
  const verb=it.cdVerb||TVERB[it.type]||'';
  const key='s'+it.id, open=OPENROWS.has(key);
  /* 日期已在左栏（MM-DD + 周），第二行只放时间 + 动作 + 状态，不再重复日期 */
  const timePart=it.time?(esc(it.time)+(verb?' '+verb:'')):(it.type==='deadline'?(verb||'截止'):'');
  const sub=[timePart,it.status?esc(it.status):''].filter(Boolean).join(' · ');
  let gut;
  if(!hasDate)gut=`<div class="sdate"><b class="mut">未定</b><span>无日期</span></div>`;
  else gut=`<div class="sdate"><b>${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}</b><span>周${WD[d.getDay()]}</span></div>`;
  /* 时间线行只在 7 天内挂倒计时胶囊，30 天后的「还剩 30 天」是噪音 */
  const pill=(days!==null&&days<=7)?`<span class="cdpill ${tier}">${over?'已逾期':days===0?'今天':days+' 天后'}</span>`:'';
  const q=(it.company+' '+(it.title||'')+' '+(it.status||'')+' '+(it.detail||'')+' '+(TL[it.type]||'')).toLowerCase();
  const hot=(days!==null&&days>=0&&days<=3)?(days<=1?' hot0':' hot1'):'';
  return `<div class="rrow srow flt${open?' open':''}${hot}" data-id="${key}" data-q="${esc(q)}">
    <div class="rhead" role="button" tabindex="0" aria-expanded="${open?'true':'false'}" onclick="toggleRow(this)" onkeydown="rowKey(event,this)">
      ${gut}
      <div style="min-width:0">
        <div class="sline1"><span class="rco">${esc(it.company||'')}</span><span class="stitle">${esc(it.title||'')}</span></div>
        <div class="smeta2">${sub?`<span class="smtxt">${sub}</span>`:''}<span class="tag tyc-${it.type||''}">${ic(TYPEIC[it.type]||'dot')}${esc(TL[it.type]||it.type||'')}</span>${warnTags(it)}</div>
      </div>
      <div class="rmeta">${pill}</div>
      <span class="rchev">${ic('chev')}</span>
    </div>
    <div class="rbody"${open?'':' hidden'}>
      ${it.detail?clampHtml(it.detail,'descr'):''}${entryLine(it)}${srcLine(it)}
      <div class="rfoot">${schedOps(it)}<button class="mini" onclick="openSchedForm(${it.id})">${ic('pencil')}编辑</button></div>
    </div>
  </div>`;
}

let SF='all';try{SF=sessionStorage.getItem('qz-sf')||'all'}catch(e){}
function setSF(t){SF=t;try{sessionStorage.setItem('qz-sf',t)}catch(e){}renderSched();}
let SVIEW='list';try{SVIEW=sessionStorage.getItem('qz-sview')||'list'}catch(e){}
let CALW=null,SELDAY=null;

function calMove(d){const base=CALW?new Date(CALW):new Date();base.setHours(0,0,0,0);base.setDate(base.getDate()+d*7);CALW=base;renderSched();}
function calToday(){CALW=null;SELDAY=null;renderSched();}
function selDay(ds){SELDAY=ds;renderSched();}
/* 日历色条收拢为三档：红＝网申截止，琥珀＝考试类，蓝＝面试类，其余灰。
   原来 8 个类型 8 色，格子里一片彩点反而看不出哪条最要紧。 */
const TYCOL={assess:'var(--warn)','exam-online':'var(--warn)','exam-offline':'var(--warn)',ai:'var(--acc)',interview:'var(--acc)',talk:'var(--mut)',deadline:'var(--danger)',todo:'var(--mut)'};
function calHtml(live,inF){
  const now=new Date();now.setHours(0,0,0,0);
  const p2=n=>String(n).padStart(2,'0');
  const dsOf=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
  const todayStr=dsOf(now);
  if(!SELDAY)SELDAY=todayStr;
  const byDay={};
  live.filter(x=>x.date&&inF(x)).forEach(x=>{
    const a=x.date,b=(x.dateEnd&&x.dateEnd>=x.date)?x.dateEnd:x.date;
    let d=new Date(a+'T00:00:00');const end=new Date(b+'T00:00:00');let guard=0;
    while(d<=end&&guard<62){(byDay[dsOf(d)]=byDay[dsOf(d)]||[]).push(x);d.setDate(d.getDate()+1);guard++;}
  });
  const anchor=CALW?new Date(CALW):new Date(now);
  const monday=new Date(anchor);monday.setDate(anchor.getDate()-((anchor.getDay()+6)%7));
  const sunday=new Date(monday);sunday.setDate(monday.getDate()+6);
  let cells='';
  for(let i=0;i<7;i++){
    const d=new Date(monday);d.setDate(monday.getDate()+i);
    const ds=dsOf(d),items=(byDay[ds]||[]).slice().sort((a,b)=>(a.time||'')<(b.time||'')?-1:1);
    const chips=items.slice(0,3).map(x=>`<div class="citem" style="border-left-color:${TYCOL[x.type]||'#999'}">${x.time&&!(x.title||'').includes(x.time)?esc(x.time)+' ':''}${esc(x.company||'')}${x.title?' · '+esc(x.title):''}</div>`).join('')+(items.length>3?`<div class="cmore">还有 ${items.length-3} 项</div>`:'');
    cells+=`<div class="cday week${ds===todayStr?' today':''}${ds===SELDAY?' sel':''}" onclick="selDay('${ds}')"><div class="cnum">${d.getDate()}</div>${ds===todayStr?'<span class="tflag">今</span>':''}${chips||'<div class="cdots"></div>'}</div>`;
  }
  const selItems=(byDay[SELDAY]||[]).slice().sort((a,b)=>(a.time||'')<(b.time||'')?-1:1);
  const sd=new Date(SELDAY+'T00:00:00');
  const range=`${monday.getMonth()+1}月${monday.getDate()}日 – ${sunday.getMonth()+1}月${sunday.getDate()}日`;
  return `<div class="calbar"><button onclick="calMove(-1)">‹ 上周</button><span class="caltitle">${monday.getFullYear()} 年 · ${range}</span><button onclick="calMove(1)">下周 ›</button><button onclick="calToday()">回到本周</button></div>
  <div class="calgrid"><div class="cwd">一</div><div class="cwd">二</div><div class="cwd">三</div><div class="cwd">四</div><div class="cwd">五</div><div class="cwd">六</div><div class="cwd">日</div>${cells}</div>
  <h2>${ic('cal','lg')}${SELDAY===todayStr?'今天':`${sd.getMonth()+1}月${sd.getDate()}日 · 周${WD[sd.getDay()]}`} <span class="cnt">${selItems.length} 项</span></h2>
  ${selItems.length?`<div class="rlist">${selItems.map(itemHtml).join('')}</div>`:'<p class="mut">这一天没有事项</p>'}`;
}
function renderSched(){
  const sc2={};DB.records.forEach(r=>sc2[r.status]=(sc2[r.status]||0)+1);
  const pipeDef=(DB.pipelineDef&&DB.pipelineDef.length)?DB.pipelineDef:[{label:'投递中',color:'#2456c4'},{label:'笔试',color:'#d97706'},{label:'面试',color:'#0e7a5f'},{label:'未通过',color:'#9aa1ad'}];
  /* 流程条颜色改由状态语义决定，不再读数据里的 color 字段（保持数据不动） */
  const pipe=pipeDef.filter(p=>p.label!=='待投线索').map(p=>`<span class="dst stc-${esc(p.label)}">${ic(PIC[p.label]||'dot')}${esc(p.label)} <b>${sc2[p.label]||0}</b></span>`).join(' ｜ ');
  const live=DB.schedule.filter(visible);
  const inF=x=>SF==='all'||x.type===SF;
  const byDT=(a,b)=>(a.date+(a.time||''))<(b.date+(b.time||''))?-1:1;
  const rush=live.filter(x=>x.date&&FIVE.includes(x.type)&&inF(x)&&daysUntil(x.date)<=7).sort(byDT);
  const rushAll=live.filter(x=>x.date&&FIVE.includes(x.type)).sort(byDT);
  const dated=live.filter(x=>x.date&&inF(x)).sort(byDT);
  const nodate=live.filter(x=>!x.date&&inF(x));
  const windows=live.filter(x=>x.type==='deadline').length;
  const cntT=t=>live.filter(x=>x.type===t).length;
  const chips=[['all','全部'],['assess','线上测评'],['exam-online','线上笔试'],['exam-offline','线下笔试'],['ai','AI面试'],['interview','真人面试'],['talk','宣讲会'],['deadline','网申截止'],['todo','待办']].map(([k,l])=>`<button data-k="${k}" class="${SF===k?'on':''}" onclick="setSF('${k}')">${ic(k==='all'?'list':(TYPEIC[k]||'dot'))}${l} ${k==='all'?live.length:cntT(k)}</button>`).join('');
  const now=new Date();
  let stat1;
  if(rushAll.length){
    const n0=rushAll[0],days=daysUntil(n0.date);
    stat1=`<div class="stat c5"><div class="num${days<=0?' red':''}">${days===0?'今天':days+'<span class="u">天</span>'}</div><div class="lab">${ic('flame')}距最近 · ${esc(n0.company||'')}</div></div>`;
  }else stat1=`<div class="stat c5"><div class="num">—</div><div class="lab">${ic('flame')}距最近节点 · 暂无</div></div>`;
  $('#sched-main').innerHTML=`
    <div class="sched-head"><div>
      <div class="today">今天 <span class="bdate">${now.getMonth()+1}月${now.getDate()}日</span> · 周${WD[now.getDay()]}</div>
</div>
      <span style="flex:1"></span><span class="seg"><button class="${SVIEW==='list'?'on':''}" onclick="setSView('list')">${ic('list')}时间线</button><button class="${SVIEW==='cal'?'on':''}" onclick="setSView('cal')">${ic('cal')}日历</button></span><button class="primary" onclick="openSchedForm()">${ic('plus')}新增日程</button></div>
    <nav class="btabs chips" style="margin:2px 0 12px">${chips}</nav>
    <div class="stats">${stat1}
      <div class="stat c7${windows?'':' zero'}"><div class="num">${windows}<span class="u">个</span></div><div class="lab">${ic('clock')}待关闭窗口</div></div>
      <div class="stat c2${dated.length?'':' zero'}"><div class="num">${dated.length}<span class="u">个</span></div><div class="lab">${ic('cal')}在途节点</div></div>
      <div class="stat c3${nodate.length?'':' zero'}"><div class="num">${nodate.length}<span class="u">件</span></div><div class="lab">${ic('inbox')}待通知 · 待处理</div></div>
    </div>
    ${SVIEW==='cal'?calHtml(live,inF):''}
    ${/* 「迫在眉睫」原为独立区块，内容就是时间线的前几行，重复渲染让 10 件事变成 13 行。
          现并入时间线：3 天内的事项用行首色条 + 行尾倒计时胶囊标记，信息不丢、不再重复。 */''}
    ${SVIEW!=='cal'?`<h2>${ic('cal','lg')}时间线 <span class="cnt">${dated.length} 项</span><span class="h2ops"><span class="lg-inline"><b style="color:var(--danger)">▍</b>今天/明天　<b style="color:var(--warn)">▍</b>2–3 天</span></span></h2>${dated.length?`<div class="rlist">${dated.map(itemHtml).join('')}</div>`:'<p class="mut">暂无</p>'}`:''}
    ${SVIEW!=='cal'?`<h2>${ic('inbox','lg')}无日期待办 <span class="cnt">${nodate.length} 件</span></h2>${nodate.length?`<div class="rlist">${nodate.map(itemHtml).join('')}</div>`:'<p class="mut">暂无</p>'}`:''}`;
  paintThemeBtn();
}
let editSchedId=null;
function openSchedForm(id){
  editSchedId=id||null;
  const it=id?DB.schedule.find(x=>x.id===id):null;
  show('sched');
  $('#sform-area').innerHTML=`<div class="card frm"><div class="fhead"><h3>${it?'编辑日程':'新增日程'}</h3><button class="ibtn" title="关闭" onclick="closeSForm()">${ic('x')}</button></div>
    <div class="fbody">
    <div class="grid">
      <div><label>公司 *</label><input type="text" id="sf-company"></div>
      <div><label>事项名 *</label><input type="text" id="sf-title" placeholder="如 线上笔试 / 终面"></div>
      <div><label>类型</label><select id="sf-type" onchange="sfTypeChanged()">${Object.entries(TL).filter(([k])=>k!=='done').map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
      <div><label>时间段（如 09:00–11:00）</label><input type="text" id="sf-time"></div>
      <div><label>日期（留空 = 无日期待办）</label><input type="date" id="sf-date"></div>
      <div><label>状态</label><input type="text" id="sf-status"></div>
      <div style="grid-column:1/-1"><label>倒计时动词（按类型自动选，可改）</label><input type="hidden" id="sf-cdverb"><div class="caps" id="sf-cdvcaps"><button type="button" onclick="setCdVerb('开考')">开考</button><button type="button" onclick="setCdVerb('开始')">开始</button><button type="button" onclick="setCdVerb('截止')">截止</button></div></div>
    </div>
    <details class="moreopts"${it&&(it.dateEnd||it.entry||it.entryText||it.link||it.linkText)?' open':''}><summary>更多选项 · 结束日期 / 链接与来源</summary>
    <div class="grid">
      <div><label>结束日期（窗口型事项）</label><input type="date" id="sf-dateend"></div>
      <div><label>行动入口文字</label><input type="text" id="sf-entrytext"></div>
      <div><label>行动入口链接</label><input type="url" id="sf-entry" placeholder="https://"></div>
      <div><label>出处文字</label><input type="text" id="sf-linktext"></div>
      <div><label>出处链接</label><input type="url" id="sf-link" placeholder="https://"></div>
    </div></details>
    <label>详情</label><textarea id="sf-detail"></textarea>
    </div>
    <div class="frow"><button class="primary" onclick="submitSchedForm()">${it?'保存修改':'添加日程'}</button><button onclick="closeSForm()">取消</button></div></div>`;
  if(it){
    $('#sf-company').value=it.company||'';$('#sf-title').value=it.title||'';$('#sf-type').value=it.type||'todo';
    $('#sf-time').value=it.time||'';$('#sf-date').value=it.date||'';$('#sf-dateend').value=it.dateEnd||'';
    $('#sf-status').value=it.status||'';$('#sf-cdverb').value=it.cdVerb||'';
    $('#sf-entry').value=it.entry||'';$('#sf-entrytext').value=it.entryText||'';
    $('#sf-link').value=it.link||'';$('#sf-linktext').value=it.linkText||'';
    $('#sf-detail').value=it.detail||'';
  }
  if(it)paintCdCaps();else sfTypeChanged();
}
function submitSchedForm(){
  const company=$('#sf-company').value.trim(),title=$('#sf-title').value.trim();
  if(!company||!title){toast('公司和事项名必填');return}
  const data={company,title,type:$('#sf-type').value,time:$('#sf-time').value.trim(),
    date:$('#sf-date').value||null,dateEnd:$('#sf-dateend').value||null,
    status:$('#sf-status').value.trim(),cdVerb:$('#sf-cdverb').value.trim(),
    entry:$('#sf-entry').value.trim(),entryText:$('#sf-entrytext').value.trim(),
    link:$('#sf-link').value.trim(),linkText:$('#sf-linktext').value.trim(),
    detail:$('#sf-detail').value.trim()};
  if(editSchedId){const it=DB.schedule.find(x=>x.id===editSchedId);if(!it)return;Object.assign(it,data);toast('已保存修改')}
  else{DB.schedule.push(Object.assign({id:nextId(DB.schedule),done:false,dropped:false},data));toast('已添加日程')}
  editSchedId=null;closeSForm();save();renderAll();
}

/* ---------------- 数据导出 / 导入 / .ics ---------------- */
function download(name,content,type){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([content],{type:type||'text/plain;charset=utf-8'}));
  a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},400);
}
function exportData(){download('秋招数据-'+todayStr()+'.json',JSON.stringify(DB,null,2),'application/json');const m=loadMeta();m.lastExportAt=Date.now();saveMeta(m);checkBackup();toast('已导出数据 JSON，可交 AI 维护或留作备份')}
/* 分享：整卡或单个岗位可复制为文本、或导出单卡 JSON；对方导入时合并进待投递，不覆盖其原有数据 */
let shareObj=null,shareSingle=false;
function shareCardObj(c,jobIdx){
const jobs=(typeof jobIdx==='number')?[c.jobs[jobIdx]]:c.jobs;
return {company:c.company,unit:c.unit||'',deadline:c.deadline||'',rolling:!!c.rolling,descr:c.descr||'',intro:c.intro||'',links:c.links||[],tags:c.tags||[],jobs:jobs.map(j=>({title:j.title,meta:j.meta||'',desc:j.desc||'',salary:j.salary||''}))};
}
function shareText(o){
const L=[`【岗位分享】${o.company}`];
if(o.unit)L.push(o.unit);
L.push(`截止：${o.deadline||(o.rolling?'招满即止':'无公布截止')}`);
const ls=(o.links||[]).filter(l=>l.href);
if(ls.length){L.push('');ls.forEach(l=>{L.push(`${l.before||''}${l.text||'链接'}`);L.push(l.href)});}
if(o.intro)L.push('',`企业简介：${o.intro}`);
if(o.descr)L.push('',`招聘说明：${o.descr}`);
o.jobs.forEach((j,i)=>{
L.push('',o.jobs.length>1?`${i+1}. ${j.title}`:j.title);
if(j.meta)L.push(j.meta);
if(j.link)L.push(`${j.link.text||'岗位详情'}：${j.link.href}`);
if(j.salary)L.push(`薪资：${j.salary}`);
if(j.desc)L.push(`JD：${j.desc}`);
});
return L.join('\n');
}
function openShare(cardId,jobIdx){
const c=DB.cards.find(x=>x.id===cardId);if(!c)return;
shareSingle=(typeof jobIdx==='number');shareObj=shareCardObj(c,jobIdx);
copyText(shareText(shareObj),'已复制分享文本，去粘贴发送吧');
}
function copyText(txt,msg){
const done=()=>toast(msg||'已复制');
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done).catch(()=>{fallbackCopy(txt);done()})}
else{fallbackCopy(txt);done()}
}
function fallbackCopy(txt){
const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove();
}
function importData(input){
  const f=input.files&&input.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{try{
      const obj=JSON.parse(rd.result);
      if(!obj||!Array.isArray(obj.cards)||!Array.isArray(obj.records)||!Array.isArray(obj.schedule))throw new Error('bad');
      DB=norm(obj);closeForm();closeSForm();save();renderAll();toast('导入成功');
    }catch(e){toast('导入失败：不是有效的数据 JSON')}};
  rd.readAsText(f);input.value='';
}
function buildIcs(){
  const rows=DB.schedule.filter(it=>it.date&&!it.done&&!it.dropped).sort((a,b)=>a.date<b.date?-1:1);
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//qiuzhao-single//CN'];
  for(const r of rows){
    const d=(r.date||'').replace(/-/g,'');if(d.length!==8)continue;
    const t=(r.time||'').split('–')[0].split('-')[0].trim().replace('：',':');
    let dt='DTSTART;VALUE=DATE:'+d;
    const m=t.match(/^(\d{1,2}):(\d{2})/);
    if(m)dt=`DTSTART:${d}T${String(m[1]).padStart(2,'0')}${m[2]}00`;
    const title=((r.company?r.company+' · ':'')+(r.title||'')).replace(/\n/g,' ');
    let desc=(r.detail||'').replace(/\n/g,'\\n');
    if(r.entry)desc+='\\n入口：'+r.entry;
    lines.push('BEGIN:VEVENT','UID:item-'+r.id+'@qiuzhao-single','DTSTAMP:20260101T000000Z',dt,'SUMMARY:'+title,'DESCRIPTION:'+desc,'END:VEVENT');
  }
  lines.push('END:VCALENDAR');
  return lines.join('\r\n')+'\r\n';
}
function exportIcs(){download('qiuzhao.ics',buildIcs(),'text/calendar');toast('已导出 .ics，可导入手机/电脑日历')}

renderAll();checkBackup();
